name: Deploy web demo to GitHub Pages

# Builds the Expo web export and publishes it to GitHub Pages so the anb
# simulation can be opened in any browser (including an iPad) with no install.

on:
  push:
    branches: [claude/anb-simulation-mobile-app-d56ox3]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Pages
        # Turns Pages on automatically (Source: GitHub Actions). Works once the
        # repo is public; exposes base_path for correct asset URLs.
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Install dependencies
        run: npm ci

      - name: Export web build
        # base_path resolves assets under https://<user>.github.io/<repo>/
        # (falls back to the repo name if the output is empty).
        env:
          EXPO_BASE_URL: ${{ steps.pages.outputs.base_path || format('/{0}', github.event.repository.name) }}
        run: npx expo export --platform web

      - name: Add SPA fallback
        # Copy index.html to 404.html so client-side routes work on refresh.
        run: cp dist/index.html dist/404.html

      - name: Disable Jekyll processing
        run: touch dist/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
