name: Deploy web demo to GitHub Pages

# Builds the Expo web export and publishes it to the gh-pages branch, which
# GitHub Pages serves at https://<user>.github.io/<repo>/. Pages is already
# enabled for this repo (source: gh-pages branch), so no special Pages
# permissions are needed — the workflow just needs to push the built site.

on:
  push:
    branches: [claude/anb-simulation-mobile-app-d56ox3]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-web
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Export web build
        # EXPO_BASE_URL makes assets resolve under https://<user>.github.io/<repo>/
        env:
          EXPO_BASE_URL: /${{ github.event.repository.name }}
        run: npx expo export --platform web

      - name: SPA + Pages housekeeping
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@4f9cc6602d3f66b9c108549d475ec49e8ef4d45e # v4.0.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
