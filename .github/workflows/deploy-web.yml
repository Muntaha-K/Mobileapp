name: Deploy web demo to GitHub Pages

# Builds the Expo web export and publishes it to GitHub Pages so the anb
# simulation can be opened in any browser (including an iPad) with no install.

on:
  push:
    branches: [claude/anb-simulation-mobile-app-d56ox3]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Export web build
        # EXPO_BASE_URL makes assets resolve under https://<user>.github.io/<repo>/
        # NOTE: GitHub Pages must be enabled once (Settings > Pages > Source:
        # GitHub Actions). Pages requires a public repo on the free plan.
        env:
          EXPO_BASE_URL: /${{ github.event.repository.name }}
        run: npx expo export --platform web

      - name: Add SPA fallback
        # Copy index.html to 404.html so client-side routes work on refresh.
        run: cp dist/index.html dist/404.html

      - name: Disable Jekyll processing
        run: touch dist/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
